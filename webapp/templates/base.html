<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Animax{% endblock %} — Animax Suite</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="brand">🎬 Animax Suite</div>
      <a class="nav-link {{ 'active' if active == 'home' else '' }}" href="{{ url_for('index') }}">🏠 لوحة التحكم</a>
      <a class="nav-link {{ 'active' if active == 'anime' else '' }}" href="{{ url_for('anime_page') }}">🎬 تحميل أنمي</a>
      <a class="nav-link {{ 'active' if active == 'youtube' else '' }}" href="{{ url_for('youtube_page') }}">📺 تحميل يوتيوب</a>
      <a class="nav-link {{ 'active' if active == 'downloads' else '' }}" href="{{ url_for('downloads_page') }}">📁 الملفات الجاهزة</a>
      <a class="nav-link {{ 'active' if active == 'settings' else '' }}" href="{{ url_for('settings_page') }}">⚙️ الإعدادات</a>
      <div class="spacer"></div>
      <a class="nav-link logout" href="{{ url_for('logout') }}">🚪 تسجيل خروج</a>
    </aside>
    <main class="main">
      {% block content %}{% endblock %}
    </main>
  </div>
  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
